# fly.toml app configuration file generated for partners-360 on 2026-08-18T10:42:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'partners-360'
primary_region = 'cdg'

[build]

# No [deploy] release_command on purpose: migrations run from the container
# entrypoint (scripts/start.sh) instead, because release-command machine logs
# are often unretrievable and turn a real migration error into a bare exit 1.

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
